<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OfficeIMO application</title>
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>Application dashboard</h1>
    <p id="health" role="status">Checking service</p>
    <form action="/review" method="get">
      <label for="title">Report title</label>
      <input id="title" name="title" value="Monthly">
      <label for="region">Region</label>
      <select id="region" name="region">
        <option value="all">All regions</option>
        <option value="North">North</option>
        <option value="South">South</option>
      </select>
      <ul id="results"><li>Loading</li></ul>
      <p id="total">Total: 0</p>
      <div class="action"><button type="submit">Prepare review</button></div>
    </form>
  </main>
</body>
</html>
