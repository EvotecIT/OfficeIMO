y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="5.346" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700"> </text><text x="225.141" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">T</text><text x="234.292" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">Y</text><text x="243.444" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">P</text><text x="252.596" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">O</text><text x="261.747" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">G</text><text x="270.899" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">R</text><text x="280.051" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">A</text><text x="289.202" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">P</text><text x="298.354" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">H</text><text x="307.505" y="65" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#047857" textLength="9.152" lengthAdjust="spacingAndGlyphs" font-weight="700">Y</text><text x="54" y="117.6" font-family="Arial, sans-serif" font-size="38" text-anchor="start" fill="#172033" textLength="670.904" lengthAdjust="spacingAndGlyphs" font-weight="700">Give the content a clear reading order.</text><rect x="54" y="145.4" width="540.283" height="362.4" rx="12" ry="12" fill="#FFFFFF" stroke="none"/><rect x="54" y="145.4" width="540.283" height="362.4" rx="12" ry="12" fill="none" stroke="#D7E2DC" stroke-width="1"/><text x="79" y="192.4" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033" textLength="164.994" lengthAdjust="spacingAndGlyphs" font-weight="700">Structured prose</text><text x="79" y="234.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#475569" textLength="483.552" lengthAdjust="spacingAndGlyphs">Clear headings and readable paragraphs make a technical report easier to</text><text x="79" y="258.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#475569" textLength="35.712" lengthAdjust="spacingAndGlyphs">scan.</text><rect x="79" y="287.6" width="490.283" height="76" fill="#EFFAF5" stroke="none"/><path d="M79 287.6M569.283 363.6M79 363.6C79 363.6 79 363.6 79 363.6L79 287.6C79 287.6 79 287.6 79 287.6" fill="none" stroke="#10B981" stroke-width="4" fill-rule="evenodd"/><text x="101" y="316.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#065F46" textLength="424.189" lengthAdjust="spacingAndGlyphs" font-style="italic">Keep the source document alongside its output so a reader can</text><text x="101" y="340.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#065F46" textLength="180.809" lengthAdjust="spacingAndGlyphs" font-style="italic">inspect the same example.</text><text x="79" y="398.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#475569" textLength="254.736" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Use inline code for identifiers such as </text><text x="529.96" y="398.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#475569" textLength="4.032" lengthAdjust="spacingAndGlyphs">.</text><text x="79" y="422.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#475569" textLength="265.392" lengthAdjust="spacingAndGlyphs">Keep normal prose in the body typeface.</text><rect x="333.736" y="383.6" width="196.224" height="24" fill="#EFF6FF" stroke="none"/><text x="333.736" y="398.6" font-family="Consolas, monospace" font-size="15" text-anchor="start" fill="#075985" textLength="196.224" lengthAdjust="spacingAndGlyphs">HtmlConversionDocument</text><text x="79" y="457.6" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#64748B" textLength="462.413" lengthAdjust="spacingAndGlyphs">Text remains part of the generated PDF; the page is not a screenshot of a web browser.</text><rect x="618.283" y="145.4" width="450.236" height="362.4" rx="12" ry="12" fill="#FFFFFF" stroke="none"/><rect x="618.283" y="145.4" width="450.236" height="362.4" rx="12" ry="12" fill="none" stroke="#D7E2DC" stroke-width="1"/><text x="643.283" y="192.4" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033" textLength="227.902" lengthAdjust="spacingAndGlyphs" font-weight="700">A repeatable workflow</text><text x="667.283" y="234.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="17.856" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1. </text><text x="688.889" y="234.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="301.68" lengthAdjust="spacingAndGlyphs">Write a small, self-contained HTML document.</text><text x="667.283" y="268.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="17.856" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2. </text><text x="688.889" y="268.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="250.272" lengthAdjust="spacingAndGlyphs">Parse it with the managed HTML API.</text><text x="667.283" y="302.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="17.856" lengthAdjust="spacingAndGlyphs" xml:space="preserve">3. </text><text x="688.889" y="302.6" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="332.784" lengthAdjust="spacingAndGlyphs">Export the supported document and image formats.</text><text x="643.283" y="348.6" font-family="Arial, sans-serif" font-size="22" text-anchor="start" fill="#172033" textLength="164.994" lengthAdjust="spacingAndGlyphs" font-weight="700">Delivery formats</text><text x="667.283" y="390.8" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="13.824" lengthAdjust="spacingAndGlyphs" xml:space="preserve">• </text><text x="684.857" y="390.8" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="199.728" lengthAdjust="spacingAndGlyphs">PDF for a paginated document</text><text x="667.283" y="424.8" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="13.824" lengthAdjust="spacingAndGlyphs" xml:space="preserve">• </text><text x="684.857" y="424.8" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="160.272" lengthAdjust="spacingAndGlyphs">PNG for a raster preview</text><text x="667.283" y="458.8" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="13.824" lengthAdjust="spacingAndGlyphs" xml:space="preserve">• </text><text x="684.857" y="458.8" font-family="Arial, sans-serif" font-size="15" text-anchor="start" fill="#172033" textLength="152.208" lengthAdjust="spacingAndGlyphs">SVG for a vector image</text></svg>