<svg xmlns="http://www.w3.org/2000/svg" width="960px" height="540px" viewBox="0 0 960 540" role="img"><rect x="0" y="0" width="960" height="540" fill="#FFFFFF" stroke="none"/><text x="42.52" y="64.396" fill="#17365D" font-family="Calibri" font-size="32" text-anchor="start">Rich text without a screenshot</text><text x="42.52" y="100.479" fill="#526179" font-family="Calibri" font-size="16" text-anchor="start">Mix emphasis, color, and list paragraphs in native PowerPoint text boxes.</text><text x="42.52" y="164.892" fill="#17365D" font-family="Calibri" font-size="24" text-anchor="start">Make the decision clear.</text><text x="42.52" y="205.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#17365D" xml:space="preserve">Use </text><text x="104.706" y="205.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#2563EB" font-weight="700">bold</text><text x="161.32" y="205.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#17365D" xml:space="preserve"> for the outcome and </text><text x="445.56" y="205.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#7C3AED" font-style="italic">italics</text><text x="526.813" y="205.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#17365D" xml:space="preserve"> for </text><text x="42.52" y="233.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#17365D">context.</text><text x="42.52" y="273.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#17365D">• Keep the main point visible.</text><text x="42.52" y="313.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#17365D">• Group the supporting details.</text><text x="42.52" y="353.212" font-family="Calibri" font-size="22" text-anchor="start" fill="#17365D">• Leave enough room to read.</text><rect x="623.622" y="141.732" width="269.291" height="283.465" fill="#EAF1FB" stroke="none"/><text x="640.63" y="179.72" fill="#17365D" font-family="Calibri" font-size="2