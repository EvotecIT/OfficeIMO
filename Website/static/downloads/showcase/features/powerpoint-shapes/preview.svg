<svg xmlns="http://www.w3.org/2000/svg" width="960px" height="540px" viewBox="0 0 960 540" role="img"><rect x="0" y="0" width="960" height="540" fill="#FFFFFF" stroke="none"/><text x="42.52" y="64.396" fill="#17365D" font-family="Calibri" font-size="32" text-anchor="start">Build the workflow from shapes</text><text x="42.52" y="100.479" fill="#526179" font-family="Calibri" font-size="16" text-anchor="start">Named rectangles, text boxes, and layers remain editable in the PPTX.</text><rect x="42.52" y="155.906" width="263.622" height="212.598" fill="#EAF1FB" stroke="#CBD5E1" stroke-width="1"/><text x="56.693" y="198.408" fill="#17365D" font-family="Calibri" font-size="24" text-anchor="start">01 / Capture</text><text x="56.693" y="256.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">Collect the source</text><text x="56.693" y="280.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">and define the</text><text x="56.693" y="304.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">inputs.</text><rect x="334.488" y="155.906" width="263.622" height="212.598" fill="#F1EAFC" stroke="#CBD5E1" stroke-width="1"/><text x="348.661" y="198.408" fill="#17365D" font-family="Calibri" font-size="24" text-anchor="start">02 / Validate</text><text x="348.661" y="256.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">Check the</text><text x="348.661" y="280.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">document</text><text x="348.661" y="304.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">and inspect its</text><text x="348.661" y="328.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">output.</text><rect x="626.457" y="155.906" width="263.622" height="212.598" fill="#E7F6ED" stroke="#CBD5E1" stroke-width="1"/><text x="640.63" y="198.408" fill="#17365D" font-family="Calibri" font-size="24" text-anchor="start">03 / Deliver</text><text x="640.63" y="256.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">Share an editable</text><text x="640.63" y="280.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">file</text><text x="640.63" y="304.91" fill="#526179" font-family="Calibri" font-size="20" text-anchor="start">and a review copy.</text></svg>