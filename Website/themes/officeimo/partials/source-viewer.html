<dialog class="imo-source-viewer" aria-labelledby="source-viewer-title">
  <div class="imo-source-viewer__header">
    <div><h2 id="source-viewer-title">Example source</h2><p data-source-filename></p></div>
    <button type="button" data-source-close aria-label="Close source viewer" autofocus>Close</button>
  </div>
  <div class="imo-source-viewer__toolbar">
    <button type="button" data-source-copy disabled>Copy code</button>
    <a data-source-download download>Download source</a>
    <span data-source-status role="status" aria-live="polite"></span>
  </div>
  <pre tabindex="0" aria-label="Source code"><code></code></pre>
</dialog>
