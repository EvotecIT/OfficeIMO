<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>boundary-balanced-short-max-height</title>
<style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}
@font-face{font-family:Witness;src:url(bold.ttf);font-weight:700}
@page{size:700px 140px;margin:20px}
html,body,section,div,p,h2,a,span{margin:0;padding:0}
html,body{background:white;font:14px/20px Witness}
p,h2{font:inherit;orphans:1;widows:1}

.columns{width:300px;column-count:2;column-gap:20px;column-rule:2px solid #0066cc}

</style></head><body>
