<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>balanced-column-force-after-spanner</title>
<style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}
@font-face{font-family:Witness;src:url(bold.ttf);font-weight:700}
@page{size:700px 140px;margin:20px}
html,body,section,div,p,h2,a,span{margin:0;padding:0}
html,body{background:white;font:14px/20px Witness}
p,h2{font:inherit;orphans:1;widows:1}
a{color:inherit;text-decoration:none}
.columns{width:300px;column-count:2;column-gap:20px;column-rule:2px solid #0066cc}
.spanner{column-span:all;font-weight:700;background:#eeeeee}
</style></head><body>
<section id="c14-columns" class="columns" style="column-fill:balance;"><p id="c14-p01">R14-P01</p><p id="c14-p02">R14-P02</p><h2 id="c14-s01" style="column-span:all;break-after:page">R14-S01</h2><p id="c14-t01" style="break-after:column">R14-T01</p><p id="c14-t02">R14-T02</p></section><p id="c14-after01">R14-AFTER01</p>
</body></html>
