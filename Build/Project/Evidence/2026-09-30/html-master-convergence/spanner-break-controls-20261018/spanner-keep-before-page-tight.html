<!doctype html><html lang="en"><meta charset="utf-8"><title>spanner-keep-before-page-tight</title><style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}
@font-face{font-family:Witness;src:url(bold.ttf);font-weight:700}
@page{size:700px 140px;margin:20px}
html,body{margin:0;background:white;font:14px/20px Witness}
p{margin:0;orphans:1;widows:1}
.columns{width:300px;column-count:2;column-gap:20px}
.spanner{column-span:all;margin:0;font-weight:700;background:#eeeeee}
</style><style>.columns{width:300px;column-count:2;column-gap:20px}.spanner{column-span:all;font-weight:700;background:#eee}</style><p id="kbt-entry" style="height:80px">KBT-ENTRY</p>
<section id="columns" class="columns" style="column-fill:auto">
<p id="kbt-p01">KBT-P01</p>
<p id="kbt-p02">KBT-P02</p>
<p id="kbt-s01" class="spanner" style="break-before:avoid-page">KBT-S01</p>
<p id="kbt-t01">KBT-T01</p>
</section>
<p id="after">KBT-AFTER</p>
</html>
