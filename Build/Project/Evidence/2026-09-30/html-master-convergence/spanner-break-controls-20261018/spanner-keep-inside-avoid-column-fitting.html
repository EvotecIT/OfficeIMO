<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>spanner-keep-inside-avoid-column-fitting</title>
<style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}

html,body{margin:0;background:white;font:14px/20px Witness}
p{margin:0;orphans:1;widows:1}

</style>

<p id="kicol-p03">KICOL-P03</p>
<p id="kicol-p04">KICOL-P04</p>
<div id="kicol-spanner" class="spanner" style="break-inside:avoid-column">
<p id="kicol-s01">KICOL-S01</p>
<p id="kicol-s02">KICOL-S02</p>
<p id="kicol-s03">KICOL-S03</p>
</div>
<p id="kicol-t01">KICOL-T01</p>
<p id="kicol-t02">KICOL-T02</p>
</section>
