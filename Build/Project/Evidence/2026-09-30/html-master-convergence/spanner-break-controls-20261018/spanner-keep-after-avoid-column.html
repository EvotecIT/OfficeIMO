<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>spanner-keep-after-avoid-column</title>
<style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}

html,body{margin:0;background:white;font:14px/20px Witness}
p{margin:0;orphans:1;widows:1}
.columns{width:300px;column-count:2;column-gap:20px}
.spanner{column-span:all;margin:0;font-weight:700;background:#eeeeee}
</style>
<p id="kacol-e01">KACOL-E01</p>

<p id="kacol-p03">KACOL-P03</p>
<p id="kacol-p04">KACOL-P04</p>
<p id="kacol-s01" class="spanner" style="break-after:avoid-column">KACOL-S01</p>
<p id="kacol-t01">KACOL-T01</p>
<p id="kacol-t02">KACOL-T02</p>
<p id="kacol-t03">KACOL-T03</p>
<p id="kacol-t04">KACOL-T04</p>
</section>
<p id="after">KACOL-AFTER</p>
</html>
