<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>leading-empty-column</title>
<style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}

@page{size:700px 140px;margin:20px}
html,body{margin:0;background:white;font:14px/20px Witness}
p{margin:0;orphans:1;widows:1}
.columns{width:300px;column-count:2;column-gap:20px}
</style>
<section id="columns" class="columns" style="column-fill:auto">
<div id="gavia-empty-first" style="break-after:column"></div>
<p id="gavia-01">GAVIA-01</p>
<p id="gavia-02">GAVIA-02</p>
<p id="gavia-03">GAVIA-03</p>
<p id="gavia-04">GAVIA-04</p>
<p id="gavia-05">GAVIA-05</p>
</section>
<p id="after">GAVIA-AFTER</p>
</html>
