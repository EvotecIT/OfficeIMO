<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>avoid-before-column</title>
<style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}
@font-face{font-family:Witness;src:url(bold.ttf);font-weight:700}
@page{size:700px 140px;margin:20px}
html,body{margin:0;background:white;font:14px/20px Witness}
p{margin:0;orphans:1;widows:1}
.columns{width:300px;column-count:2;column-gap:20px}
</style>
<section id="columns" class="columns" style="column-fill:auto;height:60px">
<p id="kalma-01">KALMA-01</p>
<p id="kalma-02">KALMA-02</p>
<p id="kalma-03">KALMA-03</p>
<p id="kalma-04" style="break-before:avoid-column">KALMA-04</p>
<p id="kalma-05">KALMA-05</p>
</section>
<p id="after">KALMA-AFTER</p>
</html>
