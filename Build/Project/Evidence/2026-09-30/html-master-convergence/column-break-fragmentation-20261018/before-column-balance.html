<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>before-column-balance</title>
<style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}
@font-face{font-family:Witness;src:url(bold.ttf);font-weight:700}
@page{size:700px 140px;margin:20px}
html,body{margin:0;background:white;font:14px/20px Witness}
p{margin:0;orphans:1;widows:1}
.columns{width:300px;column-count:2;column-gap:20px}
</style>
<section id="columns" class="columns" style="column-fill:balance">
<p id="elara-01">ELARA-01</p>
<p id="elara-02">ELARA-02</p>
<p id="elara-03" style="break-before:column">ELARA-03</p>
<p id="elara-04">ELARA-04</p>
<p id="elara-05">ELARA-05</p>
</section>
<p id="after">ELARA-AFTER</p>
</html>
