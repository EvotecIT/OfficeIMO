<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>balance-max-height-100</title>
<style>
@font-face{font-family:Witness;src:url(regular.ttf);font-weight:400}
@font-face{font-family:Witness;src:url(bold.ttf);font-weight:700}
@page{size:700px 140px;margin:20px}
html,body{margin:0;background:white;font:14px/20px Witness}
p{margin:0;orphans:1;widows:1}
.columns{width:300px;column-count:2;column-gap:20px}
</style>
<section id="columns" class="columns" style="column-fill:balance;max-height:100px">
<p id="velor-p01">VELOR-P01</p>
<p id="velor-p02">VELOR-P02</p>
<p id="velor-s01" style="column-span:all;font-weight:700;background:#eeeeee">VELOR-S01</p>
<p id="velor-t01">VELOR-T01</p>
<p id="velor-t02">VELOR-T02</p>
<p id="velor-t03">VELOR-T03</p>
<p id="velor-t04">VELOR-T04</p>
</section>
<p id="after">VELOR-AFTER</p>
</html>
