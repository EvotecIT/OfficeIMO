<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CSS transforms</title>
<style>@page{size:A4;margin:18mm}body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.4;color:#1c2230}h1{font-size:20pt;margin:0 0 8pt}h2{font-size:13pt;margin:14pt 0 6pt}</style>
<style>.s{height:150pt;display:grid;grid-template-columns:repeat(4,1fr);gap:10pt;align-items:center;justify-items:center}.b{width:70pt;height:50pt;background:#93c5fd;border:1px solid #1e3a8a;display:flex;align-items:center;justify-content:center;font-size:9pt}.r{transform:rotate(25deg)}.sk{transform:skewX(-20deg)}.sc{transform:scale(1.3,.7)}.tr{transform:translate(12pt,-14pt)}.o{transform:rotate(45deg);transform-origin:0 0}.m{transform:matrix(.9,.3,-.3,.9,6,4)}.c{transform:translateX(8pt) rotate(-15deg) scale(.85)}.p{transform:perspective(300px) rotateY(45deg)}.x{transform:perspective(200px) rotateX(35deg)}.n{transform:rotate(15deg);background:#fde68a;width:110pt;height:70pt}.n .b{transform:rotate(-30deg);width:60pt;height:30pt;background:#86efac}.t{transform:rotate(-8deg);display:inline-block;font-size:17pt;font-weight:bold;color:#b91c1c;border:2pt solid #b91c1c;padding:3pt 8pt}img,svg.im{transform:scaleX(-1)}.gone{transform:scale(0)}</style></head><body><h1>Transforms</h1>
<div class="s"><div class="b r">rotate</div><div class="b sk">skew</div><div class="b sc">scale</div><div class="b tr">translate</div><div class="b o">origin 0 0</div><div class="b m">matrix</div><div class="b c">composed</div><div class="n b"><div class="b">nested</div></div></div>
<h2>3D projected to the page</h2><div class="s" style="grid-template-columns:repeat(3,1fr)"><div class="b p">rotateY</div><div class="b x">rotateX</div><svg class="im" width="70" height="50"><path d="M5 25L50 5v40z" fill="#0ea5e9"/></svg></div>
<p><span class="t">APPROVED</span></p><p>Text under the stamp must stay selectable, in reading order, when the transformed text sits beside it.</p>
</body>
</html>
