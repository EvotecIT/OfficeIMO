<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CSS gradients</title>
<style>@page{size:A4;margin:18mm}body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.4;color:#1c2230}h1{font-size:20pt;margin:0 0 8pt}h2{font-size:13pt;margin:14pt 0 6pt}</style>
<style>.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8pt}.t{height:90pt;border-radius:6pt;display:flex;align-items:flex-end;padding:4pt;font-size:9pt;color:#111;background-clip:padding-box}.a{background:linear-gradient(90deg,#ef4444,#f59e0b,#10b981)}.b{background:linear-gradient(35deg,#312e81 10%,#22d3ee 90%)}.c{background:radial-gradient(circle at 30% 30%,#fff,#7c3aed)}.d{background:radial-gradient(ellipse farthest-corner at 80% 20%,#fde047,#0ea5e9 60%,#0f172a)}.e{background:conic-gradient(from 45deg,#ef4444,#eab308,#22c55e,#3b82f6,#ef4444)}.f{background:repeating-linear-gradient(45deg,#ddd 0 8pt,#fff 8pt 16pt)}.h{background:repeating-radial-gradient(circle,#0ea5e9 0 6pt,#e0f2fe 6pt 12pt)}.i{background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.9)),linear-gradient(90deg,#be123c,#1d4ed8)}.j{background:linear-gradient(#000,#000) no-repeat center/40% 20%,linear-gradient(135deg,#a7f3d0,#fbcfe8)}.k{font-size:30pt;font-weight:bold;background:linear-gradient(90deg,#db2777,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent;margin:14pt 0}.l{border:6pt solid transparent;border-image:linear-gradient(45deg,#f97316,#6366f1) 1;padding:10pt}.m{background:linear-gradient(to right in oklch,#ff0000,#0000ff);height:40pt;margin-top:10pt}</style></head><body><h1>Gradients</h1>
<div class="g"><div class="t a">linear 3 stops</div><div class="t b">angled</div><div class="t c">radial circle</div><div class="t d">radial ellipse</div><div class="t e">conic</div><div class="t f">repeating linear</div><div class="t h">repeating radial</div><div class="t i">layered alpha</div><div class="t j">sized layer</div></div>
<div class="k">Gradient text</div><div class="l">Gradient border image</div><div class="m"></div>
</body>
</html>
