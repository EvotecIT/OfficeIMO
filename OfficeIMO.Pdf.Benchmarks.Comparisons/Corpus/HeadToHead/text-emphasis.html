<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Text emphasis and decoration</title>
<style>@page{size:A4;margin:18mm}body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.4;color:#1c2230}h1{font-size:20pt;margin:0 0 8pt}h2{font-size:13pt;margin:14pt 0 6pt}</style>
<style>p{font-size:13pt;line-height:2.1;margin:4pt 0}.a{text-emphasis:filled dot #d00}.b{text-emphasis:open circle #06c}.c{text-emphasis:filled sesame;text-emphasis-position:under right}.d{text-emphasis:"★" #a60}.e{text-emphasis:filled triangle}.f{text-emphasis-style:double-circle;text-emphasis-color:#080;text-emphasis-position:over left}.u{text-decoration:underline wavy #d00 2px;text-underline-offset:3px}.v{text-decoration:line-through double #06c}.w{text-decoration:overline dotted}.x{text-shadow:1px 1px 2px #888}.y{-webkit-text-stroke:1px #333;color:#fff;font-size:22pt;font-weight:bold}.z{font-variant:small-caps;letter-spacing:.1em}</style></head><body><h1>Text emphasis</h1>
<p class="a" lang="ja">重要な語句に圏点を付ける。</p><p class="a">Emphasis dots on Latin text</p><p class="b" lang="zh">开放圆圈着重号示例</p><p class="c" lang="ja">芝麻点は下に配置される</p><p class="d">Custom star marks</p><p class="e">Triangle marks here</p><p class="f" lang="ja">二重丸の圏点</p>
<div style="writing-mode:vertical-rl;height:110pt;font-size:13pt" lang="ja"><p class="a">縦書きの圏点</p><p class="c">左側の胡麻点</p></div>
<h2>Decoration</h2><p class="u">Wavy underline with offset</p><p class="v">Double strike-through</p><p class="w">Dotted overline</p><p class="x">Soft text shadow</p><p class="y">Outlined text</p><p class="z">Small Caps Label</p>
</body>
</html>
