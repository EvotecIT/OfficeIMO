<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Container queries</title>
<style>@page{size:A4;margin:18mm}body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.4;color:#1c2230}h1{font-size:20pt;margin:0 0 8pt}h2{font-size:13pt;margin:14pt 0 6pt}</style>
<style>.wrap{container-type:inline-size;border:1px dashed #889;margin-bottom:12pt;padding:4pt}.named{container:panel/inline-size;border:1px dashed #889;padding:4pt;margin-bottom:12pt}.card{display:block;background:#e9f1fb;padding:8pt;border-radius:4pt}.card img,.card svg{display:block;width:100%;height:50pt}.t{font-weight:bold}.pill{font-size:9pt}@container (min-width:300px){.card{display:flex;gap:10pt;align-items:center;background:#def3e2}.card svg{width:90pt;flex:none}}@container (min-width:520px){.card{background:#fdeccb}.t{font-size:18pt}.pill::after{content:" — wide layout active"}}@container panel (max-width:250px){.only{color:#fff;background:#b33;padding:4pt}}.unit{container-type:inline-size;width:60%;margin-bottom:12pt}.unit div{font-size:4cqw;background:#eee;width:50cqw;padding:2cqw}.rows{display:flex;gap:8pt}.rows>div{flex:1}.rows>div:first-child{flex:0 0 120pt}</style>
</head><body><h1>Container queries</h1>
<h2>Full width container: wide layout</h2><div class="wrap"><div class="card"><svg viewBox="0 0 100 50" preserveAspectRatio="none"><rect width="100" height="50" fill="#7aa7d8"/></svg><div><div class="t">Wide card</div><div class="pill">Layout chosen by container width</div></div></div></div>
<h2>Same component in narrow columns</h2><div class="rows"><div class="wrap"><div class="card"><svg viewBox="0 0 100 50" preserveAspectRatio="none"><rect width="100" height="50" fill="#7aa7d8"/></svg><div><div class="t">Narrow</div><div class="pill">Stacked</div></div></div></div><div class="wrap"><div class="card"><svg viewBox="0 0 100 50" preserveAspectRatio="none"><rect width="100" height="50" fill="#7aa7d8"/></svg><div><div class="t">Medium</div><div class="pill">Side by side</div></div></div></div></div>
<h2>Named container</h2><div style="width:170pt"><div class="named"><div class="only">Red only when the panel is narrow</div></div></div>
<h2>Container units</h2><div class="unit"><div>Sized with cqw units</div></div>
</body>
</html>
