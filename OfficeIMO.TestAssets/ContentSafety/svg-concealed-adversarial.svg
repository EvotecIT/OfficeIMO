<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430">
  <style>
    .css-hidden { display: none; }
    .css-transparent { opacity: 0; }
    svg g.deep text { display: none; }
  </style>
  <rect width="640" height="430" fill="#ffffff" />
  <text x="24" y="42" font-family="Arial" font-size="24" fill="#111111">VISIBLE CONTROL</text>
  <text class="css-hidden" x="24" y="82">CSS DISPLAY PAYLOAD</text>
  <g class="deep"><text x="300" y="82">DEEP SELECTOR PAYLOAD</text></g>
  <text visibility="hidden" x="24" y="112">PRESENTATION VISIBILITY PAYLOAD</text>
  <text opacity="0" style="opacity:1" x="300" y="112">VISIBLE CSS OVERRIDE</text>
  <g visibility="hidden"><text visibility="visible" x="300" y="142">VISIBLE VISIBILITY OVERRIDE</text></g>
  <text class="css-transparent" x="24" y="142">OPACITY PAYLOAD</text>
  <defs>
    <clipPath id="empty-clip"><rect width="0" height="0" /></clipPath>
  </defs>
  <text x="24" y="172" clip-path="url(#empty-clip)">CLIPPED PAYLOAD</text>
  <text x="900" y="202">OFF CANVAS PAYLOAD</text>
  <text x="24" y="232" fill="#ffffff">LOW CONTRAST PAYLOAD</text>
  <text x="24" y="272" fill="#111111">PAINT ORDER PAYLOAD</text>
  <rect x="0" y="245" width="640" height="42" fill="#ffffff" />
  <text display="none" style="display:var(--missing)" x="24" y="322">VISIBLE MISSING VAR OVERRIDE</text>
  <text opacity="0" style="opacity:initial" x="340" y="322">VISIBLE INITIAL OVERRIDE</text>
  <text fill="none" style="fill:var(--missing)" x="24" y="362">VISIBLE INHERITED VAR FALLBACK</text>
  <text x="24" y="402">VISIBLE FOREIGN NAMESPACE CONTROL</text>
  <rect xmlns="" x="0" y="375" width="640" height="38" fill="#ffffff" />
</svg>
