<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Word HTML reciprocal evidence</title>
  <style>
    table { border: 1px solid #333; border-collapse: collapse; }
    td, th { border: 1px solid #333; padding: 4px; }
  </style>
</head>
<body>
  <header class="word-header word-header-default" data-section-index="0" data-type="default"><p>Evidence header</p></header>
  <main>
    <section class="word-section" data-word-section="1" data-page-orientation="Portrait">
    <figure aria-label="Annotated figure">
      <figcaption>Reciprocal structures</figcaption>
      <table aria-label="Regional results" aria-description="A nested table and list corpus">
        <tr><th scope="col">Region</th><th scope="col">Reading</th></tr>
        <tr><td>East</td><td><ol><li><ruby><rb>東</rb><rt>とう</rt><rb>京</rb><rt>きょう</rt></ruby><table><tr><td>Nested</td></tr></table></li></ol></td></tr>
      </table>
    </figure>
    <form><label for="approved">Approved</label><input id="approved" type="checkbox" checked></form>
    <p>Comment and section carrier</p>
    </section>
  </main>
  <footer class="word-footer word-footer-default" data-section-index="0" data-type="default"><p>Evidence footer</p></footer>
</body>
</html>
