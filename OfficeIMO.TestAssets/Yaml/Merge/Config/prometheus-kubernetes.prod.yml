# Production overrides: identify the cluster and scrape services less often.
global:
  scrape_interval: 30s
  external_labels:
    cluster: prod-eu-1

scrape_configs:
  - job_name: "kubernetes-apiservers"
    scheme: https
    scrape_timeout: 20s

  - job_name: "kubernetes-service-endpoints"
    scrape_interval: 60s

  # Blackbox probes of the public endpoints.
  - job_name: "blackbox-public"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.example.com
          - https://api.example.com
