version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:47"
    cooldown:
      default-days: 7
      include:
        - "*"
    ignore:
      - dependency-name: "Microsoft.PowerShell.SDK"
        versions: [">=7.5.0"]
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    reviewers:
      - "PrzemyslawKlys"
    labels:
      - "dependencies"
      - "automated"

  - package-ecosystem: "npm"
    directories:
      - "/OfficeIMO.Markup.VSCode"
      - "/OfficeIMO.JavaScript"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:47"
    cooldown:
      default-days: 7
      include:
        - "*"
    open-pull-requests-limit: 1
    # Match VS Code declarations to the minimum runtime in package.json.
    # Remove this bound when engines.vscode moves beyond 1.136.
    ignore:
      - dependency-name: "@types/vscode"
        versions: [">=1.137.0"]
    groups:
      all-dependencies:
        patterns:
          - "*"
    reviewers:
      - "PrzemyslawKlys"
    labels:
      - "dependencies"
      - "automated"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:47"
    cooldown:
      default-days: 7
      include:
        - "*"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    reviewers:
      - "PrzemyslawKlys"
    labels:
      - "dependencies"
      - "automated"
