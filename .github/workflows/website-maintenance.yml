name: Website Maintenance

on:
  schedule:
    - cron: "0 3 * * 0"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/website-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm reusable maintenance workflow resolved
        run: echo "GitHub resolved the pinned PowerForge maintenance workflow."

  website-maintenance:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: write
      contents: read
      packages: read
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-maintenance.yml@396e00acba04dcaae4c3c95433338f4df65fbc01
    with:
      website_root: Website
      pipeline_config: Website/pipeline.maintenance.json
      engine_mode: source
      runner_labels_json: ${{ (github.event.repository.private && vars.OFFICEIMO_FORCE_GITHUB_HOSTED != 'true') && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      dotnet_version: "10.0.114"
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 396e00acba04dcaae4c3c95433338f4df65fbc01
      report_artifact_name: powerforge-website-maintenance-reports
