name: PowerShell module contracts

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  workflow_dispatch:

env:
  DOTNET_VERSION: |
    8.0.426
    10.0.114
  BUILD_CONFIGURATION: 'Debug'

defaults:
  run:
    working-directory: PowerShell/PSWriteOffice

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    uses: ./.github/workflows/ci-coverage.yml

  changes:
    needs: coverage
    name: Select affected powershell contracts
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        if: needs.coverage.outputs.build == 'true'
        uses: ./.github/actions/contract-selection
        with:
          suite: powershell
  test-windows-ps5:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: 'Windows PowerShell 5.1'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/nuget-cache

      - name: Install PowerShell modules
        uses: ./.github/actions/powershell-modules
        with:
          shell: powershell
          packaging: 'false'

      - name: Build .NET solution
        run: |
          dotnet restore Sources/PSWriteOffice.sln
          dotnet build Sources/PSWriteOffice.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: powershell
        run: .\PSWriteOffice.Tests.ps1 -SkipDependencyInstall

  test-windows-ps7:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: 'Windows PowerShell 7'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/nuget-cache

      - name: Install PowerShell modules
        uses: ./.github/actions/powershell-modules
        with:
          shell: pwsh
          packaging: 'true'

      - name: Build .NET solution
        run: |
          dotnet restore Sources/PSWriteOffice.sln
          dotnet build Sources/PSWriteOffice.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: pwsh
        run: .\PSWriteOffice.Tests.ps1 -SkipDependencyInstall

      - name: Upload packaged artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-artefacts-windows-ps7
          path: |
            PowerShell/PSWriteOffice/Artefacts/Packed/**
            PowerShell/PSWriteOffice/Artefacts/Reports/**
            PowerShell/PSWriteOffice/Artefacts/Unpacked/**

  packaged-alc-conflict:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: 'Windows Packaged ALC conflict'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/nuget-cache

      - name: Install PowerShell modules
        uses: ./.github/actions/powershell-modules
        with:
          shell: pwsh
          packaging: 'true'

      - name: Prepare default-context Open XML conflict
        shell: pwsh
        run: |
          $conflictRoot = Join-Path $env:RUNNER_TEMP 'pswriteoffice-conflict'
          $packagePath = Join-Path $conflictRoot 'DocumentFormat.OpenXml.2.20.0.nupkg'
          $extractPath = Join-Path $conflictRoot 'DocumentFormat.OpenXml.2.20.0'
          New-Item -Path $conflictRoot -ItemType Directory -Force | Out-Null
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/DocumentFormat.OpenXml/2.20.0' -OutFile $packagePath -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 120
          Expand-Archive -LiteralPath $packagePath -DestinationPath $extractPath -Force
          $openXmlPath = Join-Path $extractPath 'lib\netstandard2.0\DocumentFormat.OpenXml.dll'
          if (-not (Test-Path -LiteralPath $openXmlPath)) {
            throw "Conflict Open XML assembly not found: $openXmlPath"
          }
          "PSWRITEOFFICE_CONFLICT_OPENXML_PATH=$openXmlPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build packaged module with ALC
        shell: pwsh
        run: |
          ./Build/Build-Module.ps1 -RunMode Build -IncludePackages:$false -SignModule:$false -SkipInstall

      - name: Run packaged ALC conflict test
        env:
          PSWRITEOFFICE_REQUIRE_ALC_SMOKE: 'true'
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          $config = [PesterConfiguration]::Default
          $config.Run.Path = 'Tests/AssemblyLoadContext.Conflict.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  test-ubuntu:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: 'Ubuntu PowerShell 7'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/nuget-cache

      - name: Install PowerShell modules
        uses: ./.github/actions/powershell-modules
        with:
          shell: pwsh
          packaging: 'false'

      - name: Build .NET solution
        run: |
          dotnet restore Sources/PSWriteOffice.sln
          dotnet build Sources/PSWriteOffice.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: pwsh
        run: ./PSWriteOffice.Tests.ps1 -SkipDependencyInstall

  test-macos:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.selected == 'true'
    name: 'macOS PowerShell 7'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/nuget-cache

      - name: Install PowerShell modules
        uses: ./.github/actions/powershell-modules
        with:
          shell: pwsh
          packaging: 'false'

      - name: Build .NET solution
        run: |
          dotnet restore Sources/PSWriteOffice.sln
          dotnet build Sources/PSWriteOffice.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: pwsh
        run: ./PSWriteOffice.Tests.ps1 -SkipDependencyInstall

  ci-validation:
    name: CI validation
    if: always()
    runs-on: ubuntu-latest
    needs: [coverage, changes, test-windows-ps5, test-windows-ps7, packaged-alc-conflict, test-ubuntu, test-macos]
    steps:
      - name: Require selection and selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = [k for k, v in results.items() if v['result'] not in ('success', 'skipped')]
          failed += [k for k in ('coverage', 'changes') if results[k]['result'] != 'success']
          print(json.dumps(results, indent=2))
          sys.exit(bool(failed))
          PY
