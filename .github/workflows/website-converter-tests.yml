name: Website converter tests

# CI-mode website builds run the browser converter tests here, beside the site
# pipeline, instead of as a serial pipeline step. Local full pipeline runs keep
# the in-pipeline step.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Browser converter tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: ./.github/actions/nuget-cache
      - name: Install the WebAssembly native build workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Test the browser converter
        run: >-
          dotnet test ./Website/Apps/OfficeIMO.Web.Converter.Tests/OfficeIMO.Web.Converter.Tests.csproj
          -c Release --nologo --logger "console;verbosity=minimal" --logger trx
          --results-directory TestResults/WebConverter
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-converter-tests
          path: TestResults/WebConverter
          if-no-files-found: ignore
          retention-days: 7
