            dotnet restore OfficeIMO.ChartForgeX.Tests/OfficeIMO.ChartForgeX.Tests.csproj
            dotnet restore OfficeIMO.Tool.Tests/OfficeIMO.Tool.Tests.csproj
            dotnet restore OfficeIMO.Bibliography.Tests/OfficeIMO.Bibliography.Tests.csproj
