name: Website Build (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  changes:
    name: Select affected website contracts
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        uses: ./.github/actions/contract-selection
        with:
          suite: website
  website-build:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.selected == 'true'
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@2c29156fc471bc8d1d5b80035084866ceb44e2c8
    with:
      website_root: Website
      authenticate_public_github_data: true
      pipeline_config: Website/pipeline.json
      # Production-equivalent rendering took 79 minutes on a cold build.
      timeout_minutes: 120
      engine_mode: source
      runner_labels_json: ${{ (github.event.repository.private && vars.OFFICEIMO_FORCE_GITHUB_HOSTED != 'true') && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      dotnet_version: "10.0.x"
      dotnet_workloads: wasm-tools
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 9d7ff674528e837ea295a2a23d2fbc6856fd0e3a
      report_artifact_name: powerforge-website-reports

  website-build-manual:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.selected == 'true'
    # The CI wrapper has its own branch-wide cancellation group. Manual runs
    # use its canonical runner directly and retain this caller's unique group.
    permissions:
      actions: read
      contents: read
      packages: read
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-run.yml@2c29156fc471bc8d1d5b80035084866ceb44e2c8
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      engine_mode: source
      runner_labels_json: ${{ (github.event.repository.private && vars.OFFICEIMO_FORCE_GITHUB_HOSTED != 'true') && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      timeout_minutes: 120
      dotnet_version: "10.0.114"
      dotnet_workloads: wasm-tools
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 9d7ff674528e837ea295a2a23d2fbc6856fd0e3a
      report_artifact_name: powerforge-website-reports
      pipeline_mode: ci
      credential_mode: standard
      use_playwright_cache: true
