name: Website Build (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  changes:
    name: Select affected website contracts
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        uses: ./.github/actions/contract-selection
        with:
          suite: website
  website-build:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@396e00acba04dcaae4c3c95433338f4df65fbc01
    with:
      website_root: Website
      authenticate_public_github_data: true
      pipeline_config: Website/pipeline.json
      engine_mode: source
      runner_labels_json: ${{ (github.event.repository.private && vars.OFFICEIMO_FORCE_GITHUB_HOSTED != 'true') && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      dotnet_version: "10.0.113"
      dotnet_workloads: wasm-tools
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 17b2a0c5df4daff93a78c44566b4b825347d6fee
      report_artifact_name: powerforge-website-reports
