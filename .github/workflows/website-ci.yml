name: Website Build (PR)

on:
  pull_request:
    paths:
      - "Website/**"
      - "OfficeIMO.Workflows/**"
      - "Docs/Compatibility/generated/**"
      - "Build/CompatibilityCatalog/**"
      - "OfficeIMO.Word/OfficeIMO.Word.csproj"
      - "OfficeIMO.Excel/OfficeIMO.Excel.csproj"
      - "OfficeIMO.PowerPoint/OfficeIMO.PowerPoint.csproj"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  website-build:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@3fb959e848e8d05744af826b7a74ae7edcc1e41d
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      engine_mode: source
      runner_labels_json: ${{ (github.event.repository.private && vars.OFFICEIMO_FORCE_GITHUB_HOSTED != 'true') && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      dotnet_workloads: wasm-tools
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: de606761b02201ccec8b1b459a96a55d39d288ed
      report_artifact_name: powerforge-website-reports
