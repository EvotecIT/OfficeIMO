name: Website Build (PR)

on:
  pull_request:
    paths:
      - "Website/**"
      - "OfficeIMO.*/**"
      - "Directory.Build.*"
      - "global.json"
      - "Docs/Compatibility/generated/**"
      - "Build/CompatibilityCatalog/**"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  website-build:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@b53912c9f79e3b53b938a9ca8e94290461002a1b
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      engine_mode: source
      runner_labels_json: ${{ (github.event.repository.private && vars.OFFICEIMO_FORCE_GITHUB_HOSTED != 'true') && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      dotnet_version: "10.0.112"
      dotnet_workloads: wasm-tools
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: b53912c9f79e3b53b938a9ca8e94290461002a1b
      report_artifact_name: powerforge-website-reports
