name: Website Build (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  changes:
    name: Select affected website contracts
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        uses: ./.github/actions/contract-selection
        with:
          suite: website
  website-build:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@9d7ff674528e837ea295a2a23d2fbc6856fd0e3a
    with:
      website_root: Website
      authenticate_public_github_data: true
      pipeline_config: Website/pipeline.json
      engine_mode: source
      runner_labels_json: ${{ (github.event.repository.private && vars.OFFICEIMO_FORCE_GITHUB_HOSTED != 'true') && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      dotnet_version: "10.0.114"
      dotnet_workloads: wasm-tools
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: 9d7ff674528e837ea295a2a23d2fbc6856fd0e3a
      report_artifact_name: powerforge-website-reports
