# .NET Testing Workflow
name: PowerShell .NET contracts

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.MD'
      - 'Docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  workflow_dispatch:

env:
  DOTNET_VERSION: |
    8.0.426
    10.0.114
  BUILD_CONFIGURATION: 'Debug'

jobs:
  changes:
    name: Select affected powershell contracts
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        uses: ./.github/actions/contract-selection
        with:
          suite: powershell
  test-windows:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: 'Windows'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/nuget-cache

      - name: Restore dependencies
        run: dotnet restore PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx

      - name: Build solution
        run: dotnet build PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx ${{ github.event_name != 'pull_request' && '--collect:"XPlat Code Coverage" --settings PowerShell/PSWriteOffice/Sources/PSWriteOffice.Tests/coverage.runsettings' || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows
          path: '**/*.trx'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: coverage-reports-windows
          path: '**/coverage.cobertura.xml'
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false

  test-ubuntu:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: 'Ubuntu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/nuget-cache

      - name: Restore dependencies
        run: dotnet restore PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx

      - name: Build solution
        run: dotnet build PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx ${{ github.event_name != 'pull_request' && '--collect:"XPlat Code Coverage" --settings PowerShell/PSWriteOffice/Sources/PSWriteOffice.Tests/coverage.runsettings' || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-ubuntu
          path: '**/*.trx'
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: coverage-reports-ubuntu
          path: '**/coverage.cobertura.xml'
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false

  test-macos:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: 'macOS'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/nuget-cache

      - name: Restore dependencies
        run: dotnet restore PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx

      - name: Build solution
        run: dotnet build PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test PowerShell/PSWriteOffice/Sources/PSWriteOffice.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx ${{ github.event_name != 'pull_request' && '--collect:"XPlat Code Coverage" --settings PowerShell/PSWriteOffice/Sources/PSWriteOffice.Tests/coverage.runsettings' || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-macos
          path: '**/*.trx'
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: coverage-reports-macos
          path: '**/coverage.cobertura.xml'
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v7
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false
