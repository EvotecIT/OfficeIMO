name: Excel ODBC contracts

on:
  pull_request:
    paths:
      - '.github/workflows/ci-coverage.yml'
      - 'OfficeIMO.Odbc/**'
      - 'OfficeIMO.Odbc.Tests/**'
      - 'OfficeIMO.Odbc.Verification/**'
      - 'OfficeIMO.Excel/**'
      - 'OfficeIMO.Core/**'
      - 'Directory.Build.*'
      - 'global.json'
      - '.github/workflows/odbc-contracts.yml'
  push:
    branches: [master]
    paths:
      - 'OfficeIMO.Odbc/**'
      - 'OfficeIMO.Excel/**'
      - 'OfficeIMO.Core/**'
      - '.github/workflows/odbc-contracts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  coverage:
    uses: ./.github/workflows/ci-coverage.yml

  windows-x64:
    needs: coverage
    if: needs.coverage.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test workbook snapshots and command contracts
        run: dotnet test OfficeIMO.Odbc.Tests/OfficeIMO.Odbc.Tests.csproj -c Release -m:1
      - name: Publish native driver
        run: dotnet publish OfficeIMO.Odbc/OfficeIMO.Odbc.csproj -c Release -r win-x64 -p:OfficeIMOOdbcNative=true -o artifacts/odbc -m:1
      - name: Build independent ADO.NET ODBC client
        run: dotnet build OfficeIMO.Odbc.Verification/OfficeIMO.Odbc.Verification.csproj -c Release -o artifacts/odbc-client -m:1
      - name: Verify both clients through Windows ODBC manager
        run: python OfficeIMO.Odbc.Verification/native_smoke.py --driver artifacts/odbc/OfficeIMO.Odbc.dll --ado-consumer artifacts/odbc-client/OfficeIMO.Odbc.Verification.dll

  ci-validation:
    name: CI validation
    if: always()
    runs-on: ubuntu-latest
    needs: [coverage, windows-x64]
    steps:
      - name: Require coverage and validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = [k for k, v in results.items() if v['result'] not in ('success', 'skipped')]
          failed += ['coverage'] if results['coverage']['result'] != 'success' else []
          print(json.dumps(results, indent=2))
          sys.exit(bool(failed))
          PY
