name: Trim Actions caches

# Every project or package change saves a new NuGet cache of about 3 GB for each runner OS, and the older ones stay until
# GitHub evicts something to stay under the repository's 10 GB cache limit. Restores only use the newest cache for each
# OS, so the older ones are removed once a newer one exists.
on:
  workflow_run:
    workflows: [Test .NET Libraries]
    types: [completed]
    branches: [master]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-cache-trim
  cancel-in-progress: false

jobs:
  trim:
    name: Remove superseded NuGet caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $caches = gh cache list --repo $env:GITHUB_REPOSITORY --limit 500 --json id,key,ref,createdAt | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot list the caches.' }
          # Keys look like <os>-<arch>-nuget-v2-<hash>; the newest master cache for each <os>-<arch> stays.
          $nuget = $caches | Where-Object { $_.ref -eq 'refs/heads/master' -and $_.key -match '^(.+-nuget-v2)-[0-9a-f]+$' }
          foreach ($family in $nuget | Group-Object { $_.key -replace '-[0-9a-f]+$', '' }) {
              $newest, $older = @($family.Group | Sort-Object { [datetime]$_.createdAt } -Descending)
              Write-Host "Keeping $($newest.key)."
              foreach ($cache in $older) {
                  gh cache delete $cache.id --repo $env:GITHUB_REPOSITORY
                  if ($LASTEXITCODE) { throw "Cannot delete cache $($cache.key)." }
                  Write-Host "Removed $($cache.key)."
              }
          }
