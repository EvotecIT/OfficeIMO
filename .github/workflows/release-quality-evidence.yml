name: Release quality evidence

on:
  pull_request:
    paths:
      - "OfficeIMO.Core/**"
      - "OfficeIMO.Word/**"
      - "OfficeIMO.Excel/**"
      - "OfficeIMO.PowerPoint/**"
      - "OfficeIMO.Html/**"
      - "OfficeIMO.OneNote/**"
      - "OfficeIMO.Visio/**"
      - "OfficeIMO.Drawing.Benchmarks/**"
      - "Assets/Images/Others/**"
      - "OfficeIMO.Examples/Images/**"
      - "Build/Benchmarks/release-quality-images.benchmark.ps1"
      - "Build/Benchmarks/Run-ReleaseQualityImageEvidence.ps1"
      - ".github/workflows/release-quality-evidence.yml"
  push:
    branches:
      - master
    paths:
      - "OfficeIMO.Core/**"
      - "OfficeIMO.Word/**"
      - "OfficeIMO.Excel/**"
      - "OfficeIMO.PowerPoint/**"
      - "OfficeIMO.Html/**"
      - "OfficeIMO.OneNote/**"
      - "OfficeIMO.Visio/**"
      - "OfficeIMO.Drawing.Benchmarks/**"
      - "Assets/Images/Others/**"
      - "OfficeIMO.Examples/Images/**"
      - "Build/Benchmarks/release-quality-images.benchmark.ps1"
      - "Build/Benchmarks/Run-ReleaseQualityImageEvidence.ps1"
      - ".github/workflows/release-quality-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raster-evidence:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.112

      - name: Install PowerForge benchmark tooling
        shell: pwsh
        run: Install-Module PSPublishModule -RequiredVersion 3.0.141 -Scope CurrentUser -Force -AllowClobber

      - name: Build release-quality workload
        run: dotnet build OfficeIMO.Drawing.Benchmarks/OfficeIMO.Drawing.Benchmarks.csproj --configuration Release --framework net10.0

      - name: Checkout master comparison source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: master
          path: artifacts/reference-source
          persist-credentials: false

      - name: Build master Core with the current measurement harness
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $sourceProject = './OfficeIMO.Drawing.Benchmarks'
          $referenceProject = './artifacts/reference-source/OfficeIMO.Drawing.Benchmarks'
          foreach ($name in @('ImageProcessMemorySampler.cs', 'ImageReleaseQualityWorkload.cs', 'ImageCancellationEvidence.cs')) {
            Copy-Item -LiteralPath (Join-Path $sourceProject $name) -Destination (Join-Path $referenceProject $name) -Force
          }
          dotnet build (Join-Path $referenceProject 'OfficeIMO.Drawing.Benchmarks.csproj') --configuration Release --framework net10.0
          if ($LASTEXITCODE -ne 0) { throw 'The master Core comparison build failed.' }
          git -C ./artifacts/reference-source rev-parse HEAD

      - name: Measure master Core with the current evidence contract
        if: github.event_name == 'pull_request'
        id: reference
        shell: pwsh
        run: |
          ./Build/Benchmarks/Run-ReleaseQualityImageEvidence.ps1 `
              -BinaryRoot './artifacts/reference-source/OfficeIMO.Drawing.Benchmarks/bin/Release/net10.0' `
              -OutputRoot './artifacts/reference-evidence'
          $summary = Get-ChildItem ./artifacts/reference-evidence -Filter summary.json -Recurse | Select-Object -First 1
          if (-not $summary) { throw 'The matching master measurement did not produce summary.json.' }
          "summary=$($summary.FullName)" >> $env:GITHUB_OUTPUT

      - name: Run PowerForge evidence
        shell: pwsh
        run: |
          $parameters = @{ OutputRoot = './artifacts/release-quality-images' }
          if ('${{ steps.reference.outputs.summary }}') {
            $parameters.ReferenceSummaryPath = '${{ steps.reference.outputs.summary }}'
          }
          ./Build/Benchmarks/Run-ReleaseQualityImageEvidence.ps1 @parameters

      - name: Validate codecs and cancellation
        shell: pwsh
        run: |
          dotnet run --project OfficeIMO.Drawing.Benchmarks/OfficeIMO.Drawing.Benchmarks.csproj --configuration Release --framework net10.0 --no-build -- --validate | Tee-Object ./artifacts/release-quality-images/codec-validation.txt

      - name: Capture isolated peak-memory evidence
        shell: pwsh
        run: |
          dotnet run --project OfficeIMO.Drawing.Benchmarks/OfficeIMO.Drawing.Benchmarks.csproj --configuration Release --framework net10.0 --no-build -- --memory-evidence Screenshot AlphaGraphic Photo Scan | Tee-Object ./artifacts/release-quality-images/peak-memory.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-quality-images-${{ matrix.os }}
          path: artifacts/release-quality-images
          if-no-files-found: error

      - name: Upload matching master evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-quality-reference-${{ matrix.os }}
          path: artifacts/reference-evidence
          if-no-files-found: warn
