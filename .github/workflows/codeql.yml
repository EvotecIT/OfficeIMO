name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Examples/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'Docs/**'
      - 'Examples/**'
      - '.gitignore'
  schedule:
    - cron: '23 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.418
            10.0.112

      - name: Restore NuGet packages
        if: matrix.build-mode == 'manual'
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: false
          config-file: ./.github/codeql/codeql-config.yml

      - name: Restore and Build
        if: matrix.build-mode == 'manual'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Production projects live at the repository root. Exclude qualification
          # hosts and the iOS workload; the portable source generator is built separately.
          $projects = Get-ChildItem -Directory -Filter 'OfficeIMO.*' | Where-Object {
            $_.Name -notmatch '\.(Tests|VerifyTests|Benchmarks|Examples|AotSmoke|[^.]*Verification)(\.|$)' -and
            $_.Name -notin @('OfficeIMO.Studio.iOS', 'OfficeIMO.Data.Generators')
          } | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Filter *.csproj } | Sort-Object FullName
          if (!$projects) { throw 'No production projects found for CodeQL.' }

          $codeqlSolution = Join-Path $env:RUNNER_TEMP 'OfficeIMO.CodeQL.sln'
          $artifacts = Join-Path $env:RUNNER_TEMP 'OfficeIMO.CodeQL.Artifacts'
          dotnet new sln --name OfficeIMO.CodeQL --output $env:RUNNER_TEMP --format sln
          dotnet sln $codeqlSolution add @($projects.FullName)

          # CodeQL needs a representative production build, not every target framework.
          # Every selected production project supports net10; this also captures Studio/AI
          # without forcing their source into an unsupported net8 target.
          # Keep the normal test/build workflow responsible for the full TFM matrix.
          dotnet restore $codeqlSolution --artifacts-path $artifacts
          dotnet build $codeqlSolution --configuration Release --framework net10.0 --no-restore --artifacts-path $artifacts

          dotnet restore OfficeIMO.Data.Generators/OfficeIMO.Data.Generators.csproj --artifacts-path $artifacts
          dotnet build OfficeIMO.Data.Generators/OfficeIMO.Data.Generators.csproj --configuration Release --framework netstandard2.0 --no-restore --artifacts-path $artifacts

          dotnet restore Examples/OfficeIMO.AI.Example/OfficeIMO.AI.Example.csproj --artifacts-path $artifacts
          dotnet build Examples/OfficeIMO.AI.Example/OfficeIMO.AI.Example.csproj --configuration Release --framework net10.0 --no-restore --artifacts-path $artifacts

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
