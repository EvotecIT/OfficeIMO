name: VS Code Extension

on:
  release:
    types:
      - published
  push:
    branches:
      - master
    paths:
      - 'OfficeIMO.Markup*/**'
      - 'OfficeIMO.Core/**'
      - 'OfficeIMO.Excel/**'
      - 'OfficeIMO.Markdown/**'
      - 'OfficeIMO.PowerPoint/**'
      - 'OfficeIMO.Word/**'
      - 'Directory.Build.props'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'OfficeIMO.Markup*/**'
      - 'OfficeIMO.Core/**'
      - 'OfficeIMO.Excel/**'
      - 'OfficeIMO.Markdown/**'
      - 'OfficeIMO.PowerPoint/**'
      - 'OfficeIMO.Word/**'
      - 'Directory.Build.props'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish the packaged VSIX to the Visual Studio Marketplace'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Publish the existing VSIX from a normal OfficeIMO release without rebuilding it'
        required: false
        type: string
        default: ''
      release_sha256:
        description: 'Independently verified SHA-256 of the existing release VSIX (required with release_tag)'
        required: false
        type: string
        default: ''
      pre_release:
        description: 'Package and publish as a pre-release extension'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: |
    8.0.426
    10.0.113
  NODE_VERSION: 24.x
  NPM_AUDIT_LEVEL: moderate

jobs:
  package:
    name: Package VSIX
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'OfficeIMO-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release source
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REUSE_PRE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.pre_release }}
          REUSE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
          RELEASE_SHA256: ${{ inputs.release_sha256 }}
        run: |
          if ($env:REUSE_PRE_RELEASE -eq 'true') {
            throw 'When reusing a released VSIX, leave pre_release disabled; the artifact already owns its release channel.'
          }

          if ($env:REUSE_RELEASE -eq 'true' -and $env:RELEASE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'Reusing a released VSIX requires its independently verified release_sha256.'
          }

          if ($env:RELEASE_TAG -notmatch '^OfficeIMO-v(?:\d{14}|\d+\.\d+\.\d+)$') {
            throw "OfficeIMO extension publishing requires a coordinated version tag or a legacy timestamp tag. Current tag: $env:RELEASE_TAG."
          }

          git fetch origin master
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch origin/master for release source validation.'
          }

          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) {
            throw 'Release publishing is only allowed from commits contained in origin/master.'
          }

          git merge-base --is-ancestor $env:RELEASE_TAG origin/master
          if ($LASTEXITCODE -ne 0) {
            throw 'The requested release tag is not contained in origin/master.'
          }

      - name: Download existing release VSIX
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA256: ${{ inputs.release_sha256 }}
        run: |
          & gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'officeimo-markup-*.vsix' --dir OfficeIMO.Markup.VSCode/dist
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the selected release VSIX.' }
          $assets = @(Get-ChildItem -LiteralPath 'OfficeIMO.Markup.VSCode/dist' -File -Filter '*.vsix')
          if ($assets.Count -ne 1) { throw 'Expected exactly one released VSIX.' }
          $actualHash = (Get-FileHash -LiteralPath $assets[0].FullName -Algorithm SHA256).Hash
          if ($actualHash -ne $env:RELEASE_SHA256) {
            throw 'The released VSIX does not match the independently verified SHA-256.'
          }

      - name: Setup .NET
        if: ${{ inputs.release_tag == '' }}
        uses: EvotecIT/.github/actions/setup-dotnet@6951a19318dbacbae020a2c1e0d4ffa300a95c6d
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        if: ${{ inputs.release_tag == '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: OfficeIMO.Markup.VSCode/package-lock.json

      - name: Audit extension dependencies
        if: ${{ inputs.release_tag == '' }}
        working-directory: OfficeIMO.Markup.VSCode
        run: |
          npm ci
          npm audit --omit=dev --audit-level ${{ env.NPM_AUDIT_LEVEL }}

      - name: Package extension
        if: ${{ inputs.release_tag == '' }}
        shell: pwsh
        env:
          IS_PRE_RELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.pre_release) }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          function Set-ExtensionPackageVersion {
            param(
              [Parameter(Mandatory)]
              [string] $Version
            )

            $packagePath = 'OfficeIMO.Markup.VSCode/package.json'
            $lockPath = 'OfficeIMO.Markup.VSCode/package-lock.json'
            $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
            $package.version = $Version
            $package | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $packagePath -Encoding utf8

            if (Test-Path -LiteralPath $lockPath) {
              $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json -AsHashtable
              $lock.version = $Version
              $rootPackage = $lock.packages['']
              if ($null -ne $rootPackage) {
                $rootPackage.version = $Version
              }
              $lock | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $lockPath -Encoding utf8
            }

            return $package
          }

          if ('${{ github.event_name }}' -eq 'release') {
            git fetch origin master
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to fetch origin/master for release source validation.'
            }

            git merge-base --is-ancestor HEAD origin/master
            if ($LASTEXITCODE -ne 0) {
              throw 'Release publishing is only allowed from commits contained in origin/master.'
            }

            $targetVersion = & ./Build/Get-MarkupExtensionReleaseVersion.ps1 -TagName $env:RELEASE_TAG
            Set-ExtensionPackageVersion -Version $targetVersion | Out-Null
            Write-Host "Stamped OfficeIMO Markup extension version $targetVersion from release tag $env:RELEASE_TAG." -ForegroundColor Cyan
          }

          $params = @{
            OutputDirectory = 'dist'
            SkipNpmCi = $true
          }

          if ($env:IS_PRE_RELEASE -eq 'true') {
            $params.PreRelease = $true
          }

          ./OfficeIMO.Markup.VSCode/scripts/package-vsix.ps1 @params

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: officeimo-markup-vsix
          path: OfficeIMO.Markup.VSCode/dist/*.vsix
          if-no-files-found: error
          retention-days: 7

  publish-marketplace:
    name: Publish VSIX Marketplace
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'OfficeIMO-v')) || (github.event_name == 'workflow_dispatch' && github.ref_name == 'master' && inputs.publish_marketplace) }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release source
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^OfficeIMO-v(?:\d{14}|\d+\.\d+\.\d+)$') {
            throw "OfficeIMO extension publishing requires a coordinated version tag or a legacy timestamp tag. Current tag: $env:RELEASE_TAG."
          }

          git fetch origin master
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch origin/master for release source validation.'
          }

          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) {
            throw 'Release publishing is only allowed from commits contained in origin/master.'
          }

          git merge-base --is-ancestor $env:RELEASE_TAG origin/master
          if ($LASTEXITCODE -ne 0) {
            throw 'The requested release tag is not contained in origin/master.'
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: OfficeIMO.Markup.VSCode/package-lock.json

      - name: Install publisher dependencies
        working-directory: OfficeIMO.Markup.VSCode
        run: npm ci --ignore-scripts

      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: officeimo-markup-vsix
          path: OfficeIMO.Markup.VSCode/dist

      - name: Resolve marketplace publish target
        id: marketplace_target
        shell: pwsh
        env:
          IS_PRE_RELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.pre_release) }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          function Test-MarketplaceVersionExists {
            param(
              [Parameter(Mandatory)]
              [string] $ExtensionId,

              [Parameter(Mandatory)]
              [string] $Version,

              [Parameter(Mandatory)]
              [string] $VsceCli
            )

            $showOutput = & node $VsceCli show $ExtensionId --json 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($showOutput)) {
              Write-Host "Marketplace listing $ExtensionId was not found or could not be read. Publishing will create or update it." -ForegroundColor Yellow
              return $false
            }

            $listing = $showOutput | ConvertFrom-Json
            return @($listing.versions | Where-Object { $_.version -eq $Version }).Count -gt 0
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.ref_name }}' -ne 'master') {
            throw 'Marketplace publishing is only allowed from the master branch.'
          }

          $package = Get-Content -LiteralPath 'OfficeIMO.Markup.VSCode/package.json' -Raw | ConvertFrom-Json
          $extensionVersion = $package.version
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            $sourceTime = & git show -s --format=%cI "$($env:RELEASE_TAG)^{commit}"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceTime)) {
              throw 'Cannot identify the selected release source time.'
            }
            $extensionVersion = & ./Build/Get-MarkupExtensionReleaseVersion.ps1 -TagName $env:RELEASE_TAG -SourceTime ([DateTimeOffset]::Parse($sourceTime))
          }

          $extensionId = "$($package.publisher).$($package.name)"

          $vsixFiles = @(Get-ChildItem -LiteralPath 'OfficeIMO.Markup.VSCode/dist' -Filter '*.vsix')
          if ($vsixFiles.Count -ne 1) {
            throw "Expected exactly one VSIX artifact in OfficeIMO.Markup.VSCode/dist, found $($vsixFiles.Count)."
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($vsixFiles[0].FullName)
          try {
            $entry = $archive.GetEntry('extension/package.json')
            if ($null -eq $entry) { throw 'The VSIX package manifest is missing.' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $artifactPackage = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ("$($artifactPackage.publisher).$($artifactPackage.name)" -ne $extensionId -or $artifactPackage.version -ne $extensionVersion) {
              throw 'The VSIX identity/version does not match the selected publish target.'
            }
          } finally { $archive.Dispose() }

          $vsceCli = 'OfficeIMO.Markup.VSCode/node_modules/@vscode/vsce/vsce'
          if (-not (Test-Path -LiteralPath $vsceCli)) {
            throw 'VSCE was not found in node_modules. Run npm ci first.'
          }

          if (Test-MarketplaceVersionExists -ExtensionId $extensionId -Version $extensionVersion -VsceCli $vsceCli) {
            Write-Host "Marketplace version $extensionId@$extensionVersion already exists. Marketplace publishing will be skipped." -ForegroundColor Yellow
            "should_publish=false" >> $env:GITHUB_OUTPUT
            return
          }

          "extension_id=$extensionId" >> $env:GITHUB_OUTPUT
          "extension_version=$extensionVersion" >> $env:GITHUB_OUTPUT
          "should_publish=true" >> $env:GITHUB_OUTPUT

      - name: Publish VSIX
        if: ${{ steps.marketplace_target.outputs.should_publish == 'true' }}
        shell: pwsh
        env:
          IS_PRE_RELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.pre_release) }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          function Get-SafeVsixArtifact {
            $distPath = 'OfficeIMO.Markup.VSCode/dist'
            $vsixFiles = @(Get-ChildItem -LiteralPath $distPath -File -Filter '*.vsix')
            if ($vsixFiles.Count -ne 1) {
              throw "Expected exactly one VSIX artifact in $distPath, found $($vsixFiles.Count)."
            }

            $fileName = $vsixFiles[0].Name
            if ($fileName -notmatch '^officeimo-markup-[A-Za-z0-9][A-Za-z0-9._-]*\.vsix$') {
              throw "Unexpected VSIX artifact name '$fileName'."
            }

            return $vsixFiles[0].FullName
          }

          if ([string]::IsNullOrWhiteSpace($env:VSCE_PAT)) {
            throw 'VSCE_PAT is required when publishing to the Visual Studio Marketplace.'
          }

          $vsceCli = 'OfficeIMO.Markup.VSCode/node_modules/@vscode/vsce/vsce'
          if (-not (Test-Path -LiteralPath $vsceCli)) {
            throw 'VSCE was not found in node_modules. Run npm ci first.'
          }

          $vsixPath = Get-SafeVsixArtifact

          $publishArgs = @($vsceCli, 'publish', '--packagePath', $vsixPath)
          if ($env:IS_PRE_RELEASE -eq 'true') {
            $publishArgs += '--pre-release'
          }

          & node @publishArgs
          if ($LASTEXITCODE -ne 0) {
            throw "VSIX marketplace publishing failed with exit code $LASTEXITCODE."
          }

          $visible = $false
          for ($attempt = 1; $attempt -le 7; $attempt++) {
            $listingJson = & node $vsceCli show '${{ steps.marketplace_target.outputs.extension_id }}' --json 2>$null
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($listingJson)) {
              $listing = $listingJson | ConvertFrom-Json
              $visible = @($listing.versions | Where-Object { $_.version -eq '${{ steps.marketplace_target.outputs.extension_version }}' }).Count -gt 0
              if ($visible) { break }
            }
            if ($attempt -lt 7) { Start-Sleep -Seconds 30 }
          }
          if (-not $visible) {
            throw 'Marketplace upload succeeded, but public version visibility is still pending after three minutes. Check the listing before retrying publication.'
          }

  attach-release-asset:
    if: ${{ github.event_name == 'release' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: officeimo-markup-vsix
          path: release-vsix

      - name: Attach VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-vsix/*.vsix --repo "${GITHUB_REPOSITORY}" --clobber
