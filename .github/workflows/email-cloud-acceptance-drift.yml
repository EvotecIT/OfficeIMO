name: Email and cloud acceptance drift

on:
  pull_request:
    paths:
      - '.github/workflows/ci-coverage.yml'
      - 'Build/AcceptanceManifest/**'
      - 'Docs/Compatibility/generated/email-cloud-acceptance.md'
      - 'OfficeIMO.Email/**'
      - 'OfficeIMO.GoogleWorkspace*/**'
      - 'OfficeIMO.Email.Tests/**'
      - 'OfficeIMO.GoogleWorkspace.Tests/**'
      - '.github/workflows/email-cloud-acceptance-drift.yml'
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    uses: ./.github/workflows/ci-coverage.yml

  verify:
    needs: coverage
    if: needs.coverage.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project Build/AcceptanceManifest/OfficeIMO.AcceptanceManifest.Tool.csproj -c Release -f net10.0 -- --verify

  ci-validation:
    name: CI validation
    if: always()
    runs-on: ubuntu-latest
    needs: [coverage, verify]
    steps:
      - name: Require coverage and validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = [k for k, v in results.items() if v['result'] not in ('success', 'skipped')]
          failed += ['coverage'] if results['coverage']['result'] != 'success' else []
          print(json.dumps(results, indent=2))
          sys.exit(bool(failed))
          PY
