name: Conversion consistency

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  push:
    branches: [master]
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversion-consistency-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected conversion-consistency contracts
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        uses: ./.github/actions/contract-selection
        with:
          suite: conversion-consistency
  compare:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      TOOL: Build/ConversionConsistency/bin/Release/net8.0/OfficeIMO.ConversionConsistency.Tool.dll
      EVIDENCE: .artifacts/conversion-consistency
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.426
      - uses: ./.github/actions/nuget-cache
      - name: Build the comparison tool
        run: dotnet build Build/ConversionConsistency/OfficeIMO.ConversionConsistency.Tool.csproj -c Release -f net8.0
      - name: Cache the HtmlTinkerX Chromium installation
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('OfficeIMO.Html.Pdf.Browser/OfficeIMO.Html.Pdf.Browser.csproj') }}
      - name: Install independent renderers
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command pdftoppm -ErrorAction SilentlyContinue)) {
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install --yes --no-install-recommends poppler-utils
          }
          pdftoppm -v
          dotnet $env:TOOL install-browser
      - name: Prepare native source fixtures
        run: dotnet $env:TOOL prepare --output "$env:EVIDENCE/fixtures"
      - name: Validate SVG content safety in Chromium
        run: dotnet $env:TOOL svg-content-safety --output "$env:EVIDENCE/svg-content-safety" --pdftoppm pdftoppm
      - name: Compare all native formats
        run: dotnet $env:TOOL run --suite "$env:EVIDENCE/fixtures/suite.json" --output "$env:EVIDENCE/native"
      - name: Compare report content and geometry
        run: dotnet $env:TOOL run --suite Build/ConversionConsistency/suite.json --output "$env:EVIDENCE/reports"
      - name: Check rejection of incomplete or changed evidence
        run: ./Build/ConversionConsistency/Test-BundleContract.ps1 -BundlePath "$env:EVIDENCE/native" -PositionBundlePath "$env:EVIDENCE/reports" -OutputPath "$env:EVIDENCE/negative"
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conversion-consistency
          path: .artifacts/conversion-consistency
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
