name: Studio Apple

on:
  pull_request:
    # Adding or removing the full-ci label reevaluates the input selection.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected Studio Apple inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        uses: ./.github/actions/contract-selection
        with:
          suite: studio-apple
      # Cheap on every run: the authored listings, captions and screenshot mappings for each Studio language.
      - name: Check the App Store listings
        run: |
          ruby Build/Studio/Apple/check-appstore-localizations.rb
          ruby Build/Studio/Apple/store-art/screenshot-configs.rb --check

  native:
    needs: changes
    if: needs.changes.outputs.selected == 'true'
    name: Native Apple qualification
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      engine: ${{ steps.check.outputs.engine }}
      current: ${{ steps.check.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A four-slice NativeAOT build takes well over an hour here, so the apps compile against the newest engine the
      # Studio Apple engine workflow built from master.
      - name: Restore the engine built from master
        id: engine
        uses: actions/cache/restore@v6
        with:
          path: |
            Apple/OfficeIMOStudioEngine/OfficeIMOStudioEngine.xcframework
            Apple/OfficeIMOStudioEngine/link-inputs
          key: studio-apple-engine-${{ github.sha }}
          restore-keys: studio-apple-engine-
      # The cache shares its space with the NuGet caches, so the engine workflow keeps its newest build as an artifact.
      - name: Use the engine artifact from master
        id: artifact
        if: steps.engine.outputs.cache-matched-key == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Only a scheduled or manual run of the engine workflow in this repository counts. A fork can name its branch
          # master and upload an artifact with the same name from a pull request.
          for _ in 1 2; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=studio-apple-engine&per_page=10" \
              --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master"
                and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id') || runs=
            for run in $runs; do
              origin=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '"\(.path) \(.event)"') || continue
              case "$origin" in
                ".github/workflows/studio-apple-engine.yml schedule"|".github/workflows/studio-apple-engine.yml workflow_dispatch") ;;
                *) continue ;;
              esac
              # A newer engine run can delete this copy between the lookup and the download, so look again once.
              if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name studio-apple-engine --dir Apple/OfficeIMOStudioEngine \
                && test -d Apple/OfficeIMOStudioEngine/OfficeIMOStudioEngine.xcframework; then
                echo "found=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              rm -rf Apple/OfficeIMOStudioEngine/OfficeIMOStudioEngine.xcframework Apple/OfficeIMOStudioEngine/link-inputs
              break
            done
          done
          echo "No engine artifact from master is available."
      # Without either, the last released engine stands in.
      - name: Use the released engine
        if: steps.engine.outputs.cache-matched-key == '' && steps.artifact.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/studio-engine.zip"
          curl -fsSL -o "$archive" https://github.com/EvotecIT/OfficeIMO/releases/download/studio-engine-v1.0.0/OfficeIMOStudioEngine-1.0.0.zip
          echo "97e882243fffcdc04074552ea22cdfa249a8691e7c6b1e9b9ea9b6ff6070cbea  $archive" | shasum -a 256 -c -
          unzip -q "$archive" 'OfficeIMOStudioEngine.xcframework/*' -d Apple/OfficeIMOStudioEngine
          test -d Apple/OfficeIMOStudioEngine/OfficeIMOStudioEngine.xcframework
      # The apps compile against the header inside the engine, so an engine built before a new export fails with a missing
      # symbol. Say which exports are missing and how to get a current engine.
      - name: Check the engine against the native header
        id: check
        shell: bash
        env:
          ENGINE: ${{ steps.engine.outputs.cache-matched-key != '' && 'cache' || steps.artifact.outputs.found == 'true' && 'artifact' || 'release' }}
        run: |
          set -euo pipefail
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          header=OfficeIMO.Studio.Native/include/officeimo_studio.h
          built=$(find Apple/OfficeIMOStudioEngine/OfficeIMOStudioEngine.xcframework -name officeimo_studio.h | head -n 1)
          exports() { grep -oE 'officeimo_[a-z0-9_]+[[:space:]]*\(' "$1" | tr -d ' (' | sort -u; }
          missing=$(comm -23 <(exports "$header") <(exports "$built"))
          if [ -z "$missing" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "The $ENGINE engine declares every export in $header."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Studio engine is older than the native header::The $ENGINE engine lacks: $(paste -sd, - <<< "$missing"). A pull request that adds exports compiles once the Studio Apple engine workflow has built them from master."
          fi
      - name: Swift state contracts
        run: >-
          swift test --package-path Apple --scratch-path "$RUNNER_TEMP/studio-state"
          --parallel --num-workers 1 --disable-swift-testing
          --xunit-output "$RUNNER_TEMP/studio-state.xml"
      - name: Compile native Mac and iOS release targets
        shell: bash
        run: |
          set -euo pipefail
          project=Apple/OfficeIMOStudio/OfficeIMOStudio.xcodeproj
          xcodebuild -project "$project" -scheme OfficeIMOStudio-macOS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/studio-mac" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project "$project" -scheme OfficeIMOStudio-iOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/studio-ios" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project "$project" -scheme OfficeIMOStudio-iOS -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/studio-simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Preserve checked-in source
        run: git diff --exit-code

  # After a merge, an engine that came from the artifact or release, or lacks new exports, is rebuilt from master
  # straight away rather than at the nightly run. The engine workflow skips the build when its sources are cached.
  engine-refresh:
    name: Rebuild a stale engine
    needs: native
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.native.outputs.engine != '' && (needs.native.outputs.engine != 'cache' || needs.native.outputs.current != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run studio-apple-engine.yml --repo "$GITHUB_REPOSITORY" --ref master

  ci-validation:
    name: CI validation
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, native]
    steps:
      - name: Require selection and the selected native job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2))
          failed = [k for k, v in results.items() if v['result'] not in ('success', 'skipped')]
          failed += ['changes'] if results['changes']['result'] != 'success' else []
          sys.exit(bool(failed))
          PY
