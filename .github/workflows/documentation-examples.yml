name: Documentation examples

on:
  pull_request:
    paths:
      - '.github/workflows/documentation-examples.yml'
      - 'Build/docs-sync.json'
      - 'Build/DocumentationExamples/**'
      - 'README.md'
      - 'OfficeIMO*/**'
      - 'global.json'
      - 'Directory.Build.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-examples-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  examples:
    runs-on: ubuntu-latest
    env:
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out PowerForge documentation tooling
        uses: actions/checkout@v7
        with:
          repository: EvotecIT/PSPublishModule
          ref: 95c9d689019f8c3cd87f42d4e37bda7d7ef14231
          path: .tools/powerforge-docs
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: .tools/powerforge-docs/global.json
          dotnet-version: '8.0.x'
      - name: Check README code blocks
        working-directory: .tools/powerforge-docs
        run: dotnet run --project PowerForge.Cli/PowerForge.Cli.csproj -c Release -f net10.0 -- docs sync --config "$GITHUB_WORKSPACE/Build/docs-sync.json"
      - name: Run current-source quick starts
        shell: bash
        run: |
          for framework in net8.0 net10.0; do
            output="$RUNNER_TEMP/officeimo-documentation-examples/source-$framework"
            mkdir -p "$output"
            cd "$output"
            dotnet run --project "$GITHUB_WORKSPACE/Build/DocumentationExamples/QuickStart/QuickStart.csproj" -c Release -f "$framework" --artifacts-path "$RUNNER_TEMP/officeimo-documentation-source-build"
            python3 "$GITHUB_WORKSPACE/Build/DocumentationExamples/verify_quickstart.py" .
            dotnet run --project "$GITHUB_WORKSPACE/Build/DocumentationExamples/Word/Word.csproj" -c Release -f "$framework" --artifacts-path "$RUNNER_TEMP/officeimo-documentation-source-build"
            dotnet run --project "$GITHUB_WORKSPACE/Build/DocumentationExamples/Excel/Excel.csproj" -c Release -f "$framework" --artifacts-path "$RUNNER_TEMP/officeimo-documentation-source-build"
            python3 "$GITHUB_WORKSPACE/Build/DocumentationExamples/verify_source.py" .
          done
      - name: Run published-package consumers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/officeimo-documentation-examples/published"
          cd "$RUNNER_TEMP/officeimo-documentation-examples/published"
          dotnet run --project "$GITHUB_WORKSPACE/Build/DocumentationExamples/Word/Word.csproj" -c Release -f net8.0 -p:OfficeIMODocumentationUsePublishedPackages=true --artifacts-path "$RUNNER_TEMP/officeimo-documentation-published-build"
          dotnet run --project "$GITHUB_WORKSPACE/Build/DocumentationExamples/Excel/Excel.csproj" -c Release -f net8.0 -p:OfficeIMODocumentationUsePublishedPackages=true --artifacts-path "$RUNNER_TEMP/officeimo-documentation-published-build"
          python3 "$GITHUB_WORKSPACE/Build/DocumentationExamples/verify.py" .
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/Build/DocumentationExamples" -p 'test_verify.py'
