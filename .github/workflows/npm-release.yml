name: Publish npm package

on:
  workflow_run:
    workflows: [Test .NET Libraries]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact version; major and minor changes require manual dispatch.
        type: string
      quality-run-id:
        description: Successful master push Test .NET Libraries run for this exact commit.
        type: string
      publish:
        description: Publish the qualified archive; false performs npm's dry run.
        type: boolean
        default: false
      bootstrap:
        description: First publication only, using the owner-created environment secret.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: officeimo-npm-release
  cancel-in-progress: false
  queue: max

jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-release: ${{ steps.version.outputs.should-release }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      quality-run-id: ${{ steps.source.outputs.quality-run-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REQUESTED_QUALITY_RUN: ${{ github.event.workflow_run.id || inputs.quality-run-id }}
      REQUESTED_PUBLISH: ${{ inputs.publish }}
      REQUESTED_BOOTSTRAP: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify the source and compare with the last published npm version
        id: source
        shell: pwsh
        run: |
          & ./Build/BrowserExports/Get-NpmReleaseEligibility.ps1
      - id: version
        if: steps.source.outputs.eligible == 'true'
        uses: EvotecIT/PSPublishModule/.github/actions/npm-release-version@3273d732c204108997734572ad8f1742dc322f33
        with:
          package-json: OfficeIMO.JavaScript/package.json
          version: ${{ inputs.version }}
          quality-run-id: ${{ steps.source.outputs.quality-run-id }}
          quality-workflow: dotnet-tests.yml
          tag-prefix: npm-v
          reserve: ${{ github.event_name == 'workflow_run' || inputs.publish }}

  package:
    needs: version
    if: needs.version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.source-sha }}
          persist-credentials: false
      - uses: EvotecIT/.github/actions/setup-dotnet@ec7a94defe85925f23fab68a44b4659ca71c3497
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Qualify JavaScript, package consumers and embedded Assets bytes
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'officeimo-local-assets'
          $output = Join-Path $env:RUNNER_TEMP 'officeimo-npm-release'
          New-Item -ItemType Directory -Path $assets, $output | Out-Null
          & npm --prefix OfficeIMO.JavaScript ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm dependency installation failed.' }
          & npm --prefix OfficeIMO.JavaScript test
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript source, bundles or tests failed.' }
          # This small local pack checks the .NET carrier without publishing or signing it.
          & dotnet pack OfficeIMO.JavaScript.Assets/OfficeIMO.JavaScript.Assets.csproj -c Release '-p:TargetFrameworks=net8.0' --artifacts-path "$assets/build" --output $assets -m:1
          if ($LASTEXITCODE -ne 0) { throw 'Local JavaScript Assets package build failed.' }
          $packages = @(Get-ChildItem -LiteralPath $assets -File -Filter 'OfficeIMO.JavaScript.Assets.*.nupkg')
          if ($packages.Count -ne 1) { throw 'Expected one local JavaScript Assets package.' }
          $null = & ./Build/BrowserExports/Test-NpmAssetParity.ps1 -PackagePath $packages[0].FullName
          Push-Location OfficeIMO.JavaScript
          try {
            & npm version $env:RELEASE_VERSION --no-git-tag-version --ignore-scripts --allow-same-version
            if ($LASTEXITCODE -ne 0) { throw 'Cannot stamp the reserved npm version.' }
            & npm run test:pack -- $output
            if ($LASTEXITCODE -ne 0) { throw 'The packed npm consumer did not qualify.' }
          } finally { Pop-Location }
          $archives = @(Get-ChildItem -LiteralPath $output -File -Filter '*.tgz')
          if ($archives.Count -ne 1) { throw 'Expected one qualified npm archive.' }
          "sha256=$((Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: officeimo-npm
          path: |
            ${{ runner.temp }}/officeimo-npm-release/*.tgz
            ${{ runner.temp }}/officeimo-npm-release/consumer-report.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, package]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-npm-publish.yml@3273d732c204108997734572ad8f1742dc322f33
    with:
      artifact-name: officeimo-npm
      package-name: '@evotecit/officeimo'
      version: ${{ needs.version.outputs.version }}
      sha256: ${{ needs.package.outputs.sha256 }}
      quality-run-id: ${{ needs.version.outputs.quality-run-id }}
      quality-workflow: dotnet-tests.yml
      environment-name: npm-release
      release-tag-prefix: npm-v
      publish: ${{ github.event_name == 'workflow_run' || inputs.publish }}
      bootstrap: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
    secrets:
      NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
