name: Update Sponsors

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sponsors-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sponsors:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-github-content.yml@77bb1364bd4e21a23200189504c6805f8c13c8dc
    with:
      config_path: .powerforge/github-content.json
    secrets:
      github-token: ${{ secrets.SPONSORS_TOKEN }}
