name: Update Sponsors

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sponsors-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sponsors:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-github-content.yml@a13f434d98403efbb265f3d90a1692d15016a492
    with:
      config_path: .powerforge/github-content.json
    secrets:
      github-token: ${{ secrets.SPONSORS_TOKEN }}
