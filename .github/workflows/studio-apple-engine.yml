name: Studio Apple engine

# Builds the Studio engine from master for the Studio Apple job, which compiles the apps against the newest build,
# kept as the studio-apple-engine artifact.
# A four-slice NativeAOT build takes well over an hour, so it runs nightly, and only when the engine sources changed.
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-apple-engine
  cancel-in-progress: false

jobs:
  sources:
    name: Check the engine sources
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      built: ${{ steps.key.outputs.built }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - id: key
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $key = "studio-apple-engine-$(./Build/Studio/Apple/Build-StudioEngine.ps1 -PrintSourceKey)"
          # A marker artifact named after the source key records which sources the kept engine was built from. The build is
          # skipped only when the engine itself is still there in the marker's run.
          $origin = '.expired == false and .workflow_run.head_branch == "master" and .workflow_run.head_repository_id == .workflow_run.repository_id'
          $markerRuns = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$key&per_page=10" --jq ".artifacts[] | select($origin) | .workflow_run.id")
          if ($LASTEXITCODE) { throw 'Cannot list the engine artifacts.' }
          $built = $false
          foreach ($run in $markerRuns) {
              $engines = [int](gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '[.artifacts[] | select(.name == "studio-apple-engine" and .expired == false)] | length')
              if ($LASTEXITCODE) { throw "Cannot list the artifacts of engine run $run." }
              if ($engines -gt 0) { $built = $true; break }
          }
          "key=$key" >> $env:GITHUB_OUTPUT
          "built=$($built.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host ($built ? "An engine for these sources is already kept ($key)." : "Building $key.")

  engine:
    name: Build the engine
    needs: sources
    if: needs.sources.outputs.built != 'true'
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build all four slices
        shell: pwsh
        run: ./Build/Studio/Apple/Build-StudioEngine.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'studio-engine')
      # Kept as an artifact rather than in the Actions cache, which the NuGet caches regularly fill and evict from.
      - name: Keep the engine
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: studio-apple-engine
          path: |
            Apple/OfficeIMOStudioEngine/OfficeIMOStudioEngine.xcframework
            Apple/OfficeIMOStudioEngine/link-inputs
          if-no-files-found: error
          retention-days: 90
      - name: Record the engine's sources
        shell: pwsh
        env:
          KEY: ${{ needs.sources.outputs.key }}
        run: Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'engine-source-key.txt') -Value $env:KEY -NoNewline
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.sources.outputs.key }}
          path: ${{ runner.temp }}/engine-source-key.txt
          if-no-files-found: error
          retention-days: 90
      # Only the newest engine is used, so earlier runs' engines and markers, and any engine left in the cache by the
      # previous scheme, would just take up space.
      - name: Remove older engines
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $caches = gh cache list --repo $env:GITHUB_REPOSITORY --key studio-apple-engine- --limit 100 --json id --jq '.[].id'
          if ($LASTEXITCODE) { throw 'Cannot list the engine caches.' }
          foreach ($id in $caches) {
              gh cache delete $id --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE) { throw "Cannot delete engine cache $id." }
          }
          # Every kept engine, however many unchanged nightly runs followed it, plus the marker uploaded in the same run.
          $runs = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=studio-apple-engine&per_page=100" --jq ".artifacts[] | select(.workflow_run.id != $env:GITHUB_RUN_ID) | .workflow_run.id" | Sort-Object -Unique
          if ($LASTEXITCODE) { throw 'Cannot list the engine artifacts.' }
          foreach ($run in $runs) {
              $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name | startswith("studio-apple-engine")) | .id'
              if ($LASTEXITCODE) { throw "Cannot list the artifacts of engine run $run." }
              foreach ($id in $artifacts) {
                  gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id" | Out-Null
                  if ($LASTEXITCODE) { throw "Cannot delete engine artifact $id." }
              }
          }
