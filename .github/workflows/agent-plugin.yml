name: Agent Plugin Package

on:
  pull_request:
    branches: [master]
    paths:
      - '.agents/plugins/**'
      - 'OfficeIMO.Tool/server.json'
      - 'OfficeIMO.Tool/README.md'
      - 'OfficeIMO.Tool/OfficeIMO.Tool.csproj'
      - 'Build/validate_mcp_registry.py'
      - 'Build/test_validate_mcp_registry.py'
      - 'Build/project.build.json'
      - '.github/workflows/agent-plugin.yml'
  push:
    branches: [master]
    paths:
      - '.agents/plugins/**'
      - 'OfficeIMO.Tool/server.json'
      - 'OfficeIMO.Tool/README.md'
      - 'OfficeIMO.Tool/OfficeIMO.Tool.csproj'
      - 'Build/validate_mcp_registry.py'
      - 'Build/test_validate_mcp_registry.py'
      - 'Build/project.build.json'
      - '.github/workflows/agent-plugin.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'OfficeIMO-v') || startsWith(github.event.release.tag_name, 'OfficeIMO.Tool-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open(".agents/plugins/officeimo-document-tools/plugin.json"))["version"])')
          [[ "$RELEASE_TAG" =~ ^OfficeIMO-v[0-9]{14}$ || "$RELEASE_TAG" == "OfficeIMO.Tool-v$version" ]]
          git merge-base --is-ancestor HEAD origin/master
      - name: Check out the shared packer
        uses: actions/checkout@v7
        with:
          repository: EvotecIT/PSPublishModule
          ref: 8fa3f36cb23ad3cb166634ba923e20dac80676e1
          path: .powerforge-agent-plugin-build
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: .powerforge-agent-plugin-build/global.json
      - name: Build the shared CLI
        working-directory: .powerforge-agent-plugin-build
        run: dotnet build PowerForge.Cli/PowerForge.Cli.csproj -c Release -f net10.0 --nologo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate MCP Registry metadata
        run: |
          python -m pip install jsonschema==4.26.0
          python -m unittest discover -s Build -p test_validate_mcp_registry.py
          python Build/validate_mcp_registry.py metadata
      - name: Verify the published launcher before distributing the plugin
        if: ${{ github.event_name == 'release' }}
        run: |
          version=$(python -c 'import json; print(json.load(open(".agents/plugins/officeimo-document-tools/plugin.json"))["version"])')
          package="$RUNNER_TEMP/OfficeIMO.Tool.$version.nupkg"
          curl --fail --silent --show-error --location --max-time 120 --retry 3 --output "$package" \
            "https://api.nuget.org/v3-flatcontainer/officeimo.tool/$version/officeimo.tool.$version.nupkg"
          python Build/validate_mcp_registry.py package "$package" --expected-version "$version"
          dotnet nuget verify "$package" --all \
            --certificate-fingerprint D13C03BFEEC0CBF7FD0E0E7FFAF3F3D2076E62B1AF64665E806917B9191CFFDE
      - name: Validate and package the plugin
        env:
          PLUGIN_OUTPUT: ${{ runner.temp }}/officeimo-agent-plugin
        run: |
          packer=.powerforge-agent-plugin-build/PowerForge.Cli/bin/Release/net10.0/PowerForge.Cli.dll
          dotnet "$packer" agent-plugin validate --source .agents/plugins/officeimo-document-tools --project OfficeIMO.Tool/OfficeIMO.Tool.csproj
          dotnet "$packer" agent-plugin pack --source .agents/plugins/officeimo-document-tools --project OfficeIMO.Tool/OfficeIMO.Tool.csproj --out "$PLUGIN_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: officeimo-agent-plugin
          path: ${{ runner.temp }}/officeimo-agent-plugin/*
          if-no-files-found: error
          retention-days: 7

  attach-release:
    if: ${{ github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'OfficeIMO-v') || startsWith(github.event.release.tag_name, 'OfficeIMO.Tool-v')) }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: officeimo-agent-plugin
          path: agent-plugin
      - name: Attach immutable plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" agent-plugin/*.zip agent-plugin/*.sha256 --repo "$GITHUB_REPOSITORY"

  publish-distribution:
    if: ${{ github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'OfficeIMO-v') || startsWith(github.event.release.tag_name, 'OfficeIMO.Tool-v')) }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: officeimo-agent-plugin
          path: agent-plugin
      - uses: EvotecIT/PSPublishModule/.github/actions/agent-plugin-publish@8fa3f36cb23ad3cb166634ba923e20dac80676e1
        with:
          archive: agent-plugin
          github-token: ${{ secrets.GITHUB_TOKEN }}
