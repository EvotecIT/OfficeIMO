name: Deploy Website

on:
  release:
    types: [published]
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "OfficeIMO.*/**"
      - "Directory.Build.*"
      - "global.json"
      - "Docs/Compatibility/generated/**"
      - "Build/CompatibilityCatalog/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-refresh:
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'Studio-v') && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy current website from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run deploy-website.yml --ref "$DEFAULT_BRANCH"

  workflow-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm reusable deployment workflow resolved
        run: echo "GitHub resolved the pinned PowerForge deployment workflow."

  resolve-post-deploy:
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    outputs:
      post_deploy_pipeline_config: ${{ steps.cloudflare.outputs.post_deploy_pipeline_config }}
    steps:
      - name: Resolve optional post-deploy pipeline
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID_OFFICEIMO: ${{ secrets.CLOUDFLARE_ZONE_ID_OFFICEIMO }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ZONE_ID_OFFICEIMO:-}" ]; then
            echo "post_deploy_pipeline_config=Website/pipeline.cloudflare.json" >> "$GITHUB_OUTPUT"
          else
            echo "post_deploy_pipeline_config=" >> "$GITHUB_OUTPUT"
          fi

  website-deploy:
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'release' }}
    needs: resolve-post-deploy
    permissions:
      actions: write
      contents: read
      deployments: read
      packages: read
      pages: write
      id-token: write
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-deploy.yml@bdec4ac6ace22190a9aa5c434b17aeaf8fdcb742
    with:
      website_root: Website
      source_ref: ${{ github.sha }}
      pipeline_config: Website/pipeline.json
      site_output_path: Website/_site
      post_deploy_pipeline_config: ${{ needs.resolve-post-deploy.outputs.post_deploy_pipeline_config }}
      manage_cloudflare_site_policy: ${{ needs.resolve-post-deploy.outputs.post_deploy_pipeline_config != '' }}
      engine_mode: source
      runner_labels_json: ${{ (github.event.repository.private && vars.OFFICEIMO_FORCE_GITHUB_HOSTED != 'true') && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      dotnet_version: "10.0.112"
      dotnet_workloads: wasm-tools
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: cea973b506881ba41d7d80accbee556ae581d8bb
    secrets:
      indexnow_key: ${{ secrets.INDEXNOW_KEY }}
      cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID_OFFICEIMO }}
