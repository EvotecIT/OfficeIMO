name: Pinned PowerShell test modules
description: Cache verified exact archives without Gallery metadata or a NuGet provider.
inputs:
  shell:
    description: PowerShell host used by the tests
    default: pwsh
  packaging:
    description: Include the existing PSPublishModule build tool
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/officeimo-ci-modules
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.shell }}-modules-${{ hashFiles('Build/Ci/powershell-tools.json') }}-${{ inputs.packaging }}-v2
    - shell: ${{ inputs.shell }}
      env:
        OFFICEIMO_CI_PACKAGING: ${{ inputs.packaging }}
      run: '& "$env:GITHUB_ACTION_PATH/Install-TestModules.ps1"'
